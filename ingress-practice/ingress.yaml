apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: ing-lab
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /web
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 80
