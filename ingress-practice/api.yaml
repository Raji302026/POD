apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ing-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: app
        image: busybox:1.37.0
        command: ["sh", "-c", "mkdir -p /www && echo hello from api > /www/api && httpd -f -p 8080 -h /www"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ing-lab
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 8080
