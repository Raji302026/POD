apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: wl-lab
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: app
        image: busybox:1.37.0
        command: ["sleep", "3600"]
