apiVersion: apps/v1
kind: Deployment
metadata:
  name: burner
  namespace: hpa-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: burner
  template:
    metadata:
      labels:
        app: burner
    spec:
      containers:
      - name: burner
        image: busybox:1.37.0
        command: ["sh", "-c", "sleep 3600"]
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: 200m
