name: vars-and-secrets
on:
  workflow_dispatch:
jobs:
  show:
    runs-on: ubuntu-24.04
    steps:
      - name: Print variable
        run: echo "APP_ENV is ${{ vars.APP_ENV }}"
      - name: Try to print secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "Secret value: $DEMO_SECRET"
          echo "Secret length: ${#DEMO_SECRET}"
