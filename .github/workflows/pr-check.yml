name: pr-check

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Block FIXME in markdown files
        run: |
          if grep -rn "FIXME" --include="*.md" .; then
            echo "FIXME found - fix before merging"
            exit 1
          fi
          echo "No FIXME found"
