name: pr-check

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Block FIXME in markdown files
        run: |
          if grep -rn "FIXME" --include="*.md" .; then
            echo "FIXME found - fix before merging"
            exit 1
          fi
          echo "No FIXME found"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan for secrets
        run: ./gitleaks dir . --redact --no-banner
