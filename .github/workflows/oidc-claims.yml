name: oidc-claims
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  show-claims:
    runs-on: ubuntu-24.04
    steps:
      - name: Request token and print claims only
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          echo "$TOKEN" | python3 -c 'import sys,json,base64; p=sys.stdin.read().strip().split(".")[1]; p+="="*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:d.get(k) for k in ["iss","sub","aud","repository","ref"]},indent=2))'
