name: prometheus-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prometheus-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/observability-practice":/cfg prom/prometheus:v3.15.0 check rules /cfg/alerts.yml
      - name: Check config
        run: docker run --rm --entrypoint promtool -v "$PWD/observability-practice":/cfg prom/prometheus:v3.15.0 check config /cfg/prometheus.yml
      - name: Check Alertmanager config
        run: docker run --rm --entrypoint amtool -v "$PWD/observability-practice":/cfg prom/alertmanager:v0.34.1 check-config /cfg/alertmanager.yml
      - name: Validate compose file
        run: docker compose -f observability-practice/docker-compose.yml config --quiet
