name: docker-build
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-practice/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pod-demo:${{ github.sha }} docker-practice
      - name: Show image
        run: docker images pod-demo
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 pod-demo:${{ github.sha }}
