name: docker-build
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-practice/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pod-demo:${{ github.sha }} docker-practice
      - name: Show image
        run: docker images pod-demo
