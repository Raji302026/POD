name: perf-lab
on:
  push:
    paths:
      - 'perf-practice/**'
      - '.github/workflows/perf-lab.yml'
  workflow_dispatch:
concurrency:
  group: perf-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sequential:
    runs-on: ubuntu-latest
    steps:
      - name: part 1
        run: sleep 20
      - name: part 2
        run: sleep 20
      - name: part 3
        run: sleep 20
  parallel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [1, 2, 3]
    steps:
      - name: part ${{ matrix.part }}
        run: sleep 20
  hung:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: sleep too long
        run: sleep 120
