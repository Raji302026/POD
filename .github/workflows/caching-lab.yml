name: caching-lab
on:
  push:
    paths:
      - 'caching-practice/**'
      - '.github/workflows/caching-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install without cache
        run: |
          start=$(date +%s)
          pip install --no-cache-dir -r caching-practice/requirements.txt
          echo "no-cache install seconds: $(( $(date +%s) - start ))"
  with-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: caching-practice/requirements.txt
      - name: Install with cache
        run: |
          start=$(date +%s)
          pip install -r caching-practice/requirements.txt
          echo "with-cache install seconds: $(( $(date +%s) - start ))"
# second run to test the cache
