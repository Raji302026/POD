apiVersion: v1
kind: Pod
metadata:
  name: bad-readiness
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      readinessProbe:
        httpGet:
          path: /nope
          port: 80
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-liveness
  labels:
    app: live
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      livenessProbe:
        httpGet:
          path: /nope
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 3
        failureThreshold: 2
