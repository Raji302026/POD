apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  namespace: probe-lab
spec:
  containers:
  - name: app
    image: busybox:1.37.0
    command: ["sh", "-c", "touch /tmp/alive /tmp/ready; sleep 3600"]
    readinessProbe:
      exec:
        command: ["cat", "/tmp/ready"]
      periodSeconds: 5
    livenessProbe:
      exec:
        command: ["cat", "/tmp/alive"]
      periodSeconds: 5
      failureThreshold: 2
