apiVersion: v1
kind: Pod
metadata:
  name: slow-fixed
  namespace: probe-lab
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: app
    image: busybox:1.37.0
    command: ["sh", "-c", "sleep 20; touch /tmp/alive; sleep 3600"]
    startupProbe:
      exec:
        command: ["cat", "/tmp/alive"]
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:
      exec:
        command: ["cat", "/tmp/alive"]
      periodSeconds: 5
      failureThreshold: 2
