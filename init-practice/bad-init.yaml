apiVersion: v1
kind: Pod
metadata:
  name: bad-init
  namespace: init-lab
spec:
  initContainers:
  - name: fail
    image: busybox:1.37.0
    command: ["sh", "-c", "echo failing; exit 1"]
  containers:
  - name: app
    image: busybox:1.37.0
    command: ["sh", "-c", "echo app started; sleep 3600"]
