apiVersion: v1
kind: Pod
metadata:
  name: waiter
  namespace: init-lab
spec:
  initContainers:
  - name: wait-for-db
    image: busybox:1.37.0
    command: ["sh", "-c", "until nslookup db-svc.init-lab.svc.cluster.local; do echo waiting; sleep 3; done"]
  containers:
  - name: app
    image: busybox:1.37.0
    command: ["sh", "-c", "echo app started; sleep 3600"]
