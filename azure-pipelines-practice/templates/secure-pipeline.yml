parameters:
  - name: buildSteps
    type: stepList
    default: []

stages:
  - stage: Build
    jobs:
      - job: build
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
          - script: |
              echo "Running secret scan"
              docker run --rm -v "$(Build.SourcesDirectory)":/repo zricethezav/gitleaks:v8.30.1 detect --source /repo --no-git --verbose
            displayName: Mandatory secret scan
          - ${{ parameters.buildSteps }}
          - script: |
              echo "Compliance record: build $(Build.BuildId) result $(Agent.JobStatus)"
            displayName: Mandatory compliance step
            condition: always()
