trigger: none

pool:
  vmImage: ubuntu-latest

steps:
- task: AzureKeyVault@2
  displayName: Read secrets from Key Vault
  inputs:
    azureSubscription: 'sc-example-connection'
    KeyVaultName: 'kv-example-dev'
    SecretsFilter: 'db-password,api-key'
    RunAsPreJob: true

- script: ./deploy.sh
  displayName: Deploy
  env:
    DB_PASSWORD: $(db-password)
    API_KEY: $(api-key)
