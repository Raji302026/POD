apiVersion: v1
kind: Pod
metadata:
  name: readiness-fail-test
  labels:
    app: readiness-fail-test
spec:
  containers:
  - name: nginx
    image: docker.io/library/nginx:latest
    imagePullPolicy: IfNotPresent
    readinessProbe:
      httpGet:
        path: /nonexistent-path
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 3
      failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-fail-svc
spec:
  selector:
    app: readiness-fail-test
  ports:
  - port: 80
