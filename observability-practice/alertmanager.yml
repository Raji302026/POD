route:
  receiver: default
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-oncall
      repeat_interval: 1h
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, job]
receivers:
  - name: default
  - name: critical-oncall
    webhook_configs:
      - url: http://example.invalid/oncall
