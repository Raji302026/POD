apiVersion: batch/v1
kind: CronJob
metadata:
  name: ticker
  namespace: cj-lab
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: tick
            image: busybox:1.37.0
            command: ["sh", "-c", "date; sleep 90; echo tick done"]
