apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ss-lab
spec:
  clusterIP: None
  selector:
    app: web
  ports:
  - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: ss-lab
spec:
  serviceName: web
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: busybox:1.37.0
        command: ["sh", "-c", "echo running; sleep 3600"]
